<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSTECH16 | Gerenciar produtos</title><link rel="stylesheet" href="/static/css/style.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="/static/dashboard.html"><span class="brand-mark small">CS</span>CSTECH16</a><nav><a href="/static/dashboard.html">▦ Dashboard</a><a class="active" href="/static/produtos.html">▣ Produtos</a><a href="/static/funcionarios.html" id="employee-nav" hidden>♙ Funcionários</a><a href="/static/loja.html">↗ Ver loja</a></nav><button class="btn ghost full" type="button" data-logout>Sair da conta</button></aside><main class="main-content"><header class="topbar"><div><p class="eyebrow">GESTÃO DE ESTOQUE</p><h1>Produtos</h1><p class="muted">Cadastre, edite e remova produtos da vitrine.</p></div><a class="btn secondary" href="/static/dashboard.html">← Dashboard</a></header><section class="panel"><h2 id="product-form-title">Cadastrar produto</h2><form id="product-form" class="form-grid"><div><label for="p-nome">Nome</label><input id="p-nome" name="nome" maxlength="50" required></div><div><label for="p-marca">Marca</label><input id="p-marca" name="marca" maxlength="30" required></div><div><label for="p-preco">Preço (R$)</label><input id="p-preco" name="preco_venda" type="number" min="0.01" step="0.01" required></div><div><label for="p-quantidade">Quantidade em estoque</label><input id="p-quantidade" name="quantidade" type="number" min="0" step="1" required></div><div><label for="p-categoria">Categoria</label><input id="p-categoria" name="categoria" maxlength="100" required></div><div><label for="p-imagem">URL da imagem (opcional)</label><input id="p-imagem" name="imagem_url" type="url" placeholder="https://..."></div><div class="span-2"><button class="btn primary" id="product-submit" type="submit">Cadastrar produto</button> <button class="btn secondary" id="product-cancel" type="button" hidden>Cancelar edição</button><p class="message" id="product-message" role="status"></p></div></form></section><section class="panel"><div class="panel-heading"><div><h2>Produtos cadastrados</h2><p class="muted">Dados consultados diretamente na API.</p></div><button class="btn secondary" id="refresh-products" type="button">Atualizar</button></div><div class="table-wrap" id="products-content">Carregando...</div></section></main></div><script src="/static/js/app.js"></script><script src="/static/js/produtos.js"></script></body></html>
