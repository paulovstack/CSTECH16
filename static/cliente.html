
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CSTECH16 | Cadastro</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-page">

    <main class="auth-card wide">

        <!-- Link para voltar ao login -->
        <a class="back-link" href="/">
            ← Voltar ao login
        </a>

        <!-- Identidade visual -->
        <div class="brand-mark">CS</div>

        <p class="eyebrow">CSTECH16</p>

        <!-- Título e descrição -->
        <h1>Criar conta</h1>

        <p class="muted">
            Preencha seus dados para se cadastrar como cliente.
        </p>

        <!-- Formulário de cadastro -->
        <form id="cliente-form" class="form-grid">

            <!-- CPF -->
            <div>
                <label for="cpf">CPF</label>

                <input
                    id="cpf"
                    name="cpf"
                    type="text"
                    required
                    placeholder="Somente números"
                    inputmode="numeric"
                >
            </div>

            <!-- Nome completo -->
            <div>
                <label for="nome">Nome completo</label>

                <input
                    id="nome"
                    name="nome"
                    type="text"
                    required
                    autocomplete="name"
                >
            </div>

            <!-- Telefone -->
            <div>
                <label for="telefone">Telefone</label>

                <input
                    id="telefone"
                    name="telefone"
                    type="tel"
                    placeholder="(00) 00000-0000"
                    autocomplete="tel"
                >
            </div>

            <!-- E-mail -->
            <div>
                <label for="cad-email">E-mail</label>

                <input
                    id="cad-email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                >
            </div>

            <!-- Status da conta -->
            <div>
                <label for="status">Status da conta</label>
                <select id="status" name="status" required>
                    <option value="true" selected>Ativo</option>
                    <option value="false">Inativo</option>
                </select>
                <small>Contas inativas não poderão entrar no sistema.</small>
            </div>

            <!-- Senha -->
            <div class="span-2">
                <label for="cad-senha">Senha</label>

                <input
                    id="cad-senha"
                    name="senha"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <small>
                    Use pelo menos 8 caracteres.
                </small>
            </div>

            <!-- Botão e mensagens -->
            <div class="span-2">

                <button
                    class="btn primary full"
                    type="submit"
                >
                    Criar cadastro
                </button>

                <p
                    id="cliente-message"
                    class="message"
                    role="status"
                ></p>

            </div>

        </form>

    </main>

    <!-- Script responsável pelo cadastro -->
    
<script src="/static/js/app.js"></script>
<script src="/static/js/clientes.js"></script>


</body>
</html>
